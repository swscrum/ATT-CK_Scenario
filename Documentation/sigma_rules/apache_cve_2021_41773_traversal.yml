title: T1190 — CVE-2021-41773 Path Traversal Exploitation Against Apache
id: 8d8d4f1a-3f71-4d36-9e72-cve41773-waystar-01
status: experimental
description: |
  Detects exploitation attempts of CVE-2021-41773 against Apache 2.4.49/2.4.50.
  The path-traversal pattern uses URL-encoded `.%2e` (or double-encoded
  `.%32%65`) segments inside `/cgi-bin/` to escape the cgi-bin directory and
  reach `/bin/sh` (or any other binary). A POST with this pattern that returns
  200 means a shell ran.

  In the lab the attacker sends three plausible-but-failing variants before
  the working POST payload (initial_access.py:fire_exploit), so a real chain
  run produces 4 distinct events for this technique within ~1 second.

  TRANSPORT FINGERPRINT: the attacker delivers all four requests over
  plain HTTP (port 80) even though apache serves HTTPS on :443 as the
  primary transport. EVERY OTHER client in the lab (noise containers,
  workstation activity_sim, monitor checks) uses HTTPS — so the URL
  pattern AND the bare-HTTP transport are *both* anomalies. The matching
  events land in `access.log` (not `access_ssl.log`); ingesting only the
  plain-HTTP access log is sufficient to fire the rule, and the absence
  of any matching `access_ssl.log` entry is itself confirmatory.
references:
  - https://nvd.nist.gov/vuln/detail/CVE-2021-41773
  - Documentation/mappings.md — row "T1190 (CVE-2021-41773)"
author: Waystar lab
date: 2026-05-31
tags:
  - attack.initial_access
  - attack.t1190
  - cve.2021.41773
logsource:
  category: webserver
  product: apache
detection:
  selection:
    cs-uri-stem|contains:
      - '/cgi-bin/.%2e'        # single URL-encoded `.` after cgi-bin/
      - '/cgi-bin/.%32%65'     # double-URL-encoded `.` (the working payload)
      - '/cgi-bin/.%%32%65'    # double-percent variant seen in some scanners
  condition: selection
falsepositives:
  - None known. The pattern is specific to this CVE; any legitimate request
    to a CGI script should not contain percent-encoded dot segments.
  - The noise_user_sim container does NOT generate this pattern (its
    PROBE_PATHS list intentionally avoids /cgi-bin/).
level: high
fields:
  - c-ip
  - cs-method
  - cs-uri-stem
  - sc-status
  - cs-user-agent
