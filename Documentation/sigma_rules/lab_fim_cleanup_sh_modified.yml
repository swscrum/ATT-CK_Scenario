title: T1053.003 — Privileged Cron Script Modified (cleanup.sh)
id: 1b8c2d4e-5f9a-4e02-bb13-cleanup-modify-01
status: experimental
description: |
  Detects modification of `/opt/cleanup.sh` on the apache container. This
  script runs as root every minute via cron and is intentionally
  world-writable (the seeded "misconfig" — see scenario_story.md). Any
  MODIFY event on it that is NOT generated by the legitimate sysadmin
  (Vinzenz Fedora, via his SSH session) indicates an attacker is using
  the cron job as a privilege-escalation primitive (T1053.003 + T1068).

  Lab-FIM (inotify substitute for auditd inside the container) emits
  one line per event in a stable key=value format — Sigma matches the
  `tag` and `event` fields.
references:
  - Documentation/mappings.md — row "T1053.003 cron tampering"
  - Infrastructure/apache/lab-fim.sh — watch list
author: Waystar lab
date: 2026-05-31
tags:
  - attack.privilege_escalation
  - attack.persistence
  - attack.t1053.003
  - attack.t1068
logsource:
  category: file_event
  product: linux
  service: lab-fim
detection:
  selection:
    tag: 'lab_fim'
    path: '/opt/cleanup.sh'
    event:
      - 'MODIFY'
      - 'CREATE'
      - 'CLOSE_WRITE'
  condition: selection
falsepositives:
  - Legitimate maintenance by Vinzenz Fedora (correlate with sshd
    `Accepted publickey for vinzenz.fedora` on apache from 10.30.0.8
    within ±60s). The chain never touches the script under vinzenz's
    identity, so during a chain run this exception should never apply.
level: high
fields:
  - timestamp
  - tag
  - path
  - event
