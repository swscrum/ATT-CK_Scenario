title: T1110.004 — Credential Stuffing Burst Against sshd (one-pass-per-host)
id: 2c9d3e5f-6a7b-4f88-bb33-creds-spray-01
status: experimental
description: |
  Detects the lab's credential-stuffing pattern: the same source IP
  attempts to authenticate to multiple internal hosts using ONE password
  per attempt within a short window. Because the password is John's
  (`waystar2026!`) and is only valid for the `john.stravidis` account on
  John's own workstation, the result is one `Accepted password` plus N-1
  `Failed password` events from the same source IP in seconds.

  In the chain this is fired from inside apache (root reverse shell)
  via sshpass against the discovered hosts (10.30.0.0/24 :22). Source
  IP in the auth.log is the post-NAT router IP (10.40.0.4); the pre-NAT
  source is visible in the router's NFLOG.
references:
  - Documentation/mappings.md — row "T1110.004 credential stuffing"
  - Attack-chain/credential_stuffing.py
author: Waystar lab
date: 2026-05-31
tags:
  - attack.credential_access
  - attack.t1110.004
logsource:
  category: authentication
  product: linux
  service: sshd
detection:
  failed:
    process: sshd
    Message|contains: 'Failed password for'
  timeframe: 60s
  condition: |
    failed | count(host) by src_ip > 1
falsepositives:
  - A user fat-fingering their password across multiple servers (rare in
    a SOC training scenario; should not happen during a chain run).
  - Automation that retries with stale credentials. Confirm by checking
    the source IP — only the chain's source (10.40.0.4 post-NAT from
    apache, or 10.10.0.2 from kali in the noise+attacker case) is the
    attacker.
level: medium
fields:
  - timestamp
  - hostname
  - process
  - src_ip
  - target_user
  - Message
