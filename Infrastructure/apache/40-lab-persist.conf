# /etc/rsyslog.d/40-lab-persist.conf
#
# Mirror auth.log and syslog to /usr/local/apache2/logs/ so they land on the
# host via the existing apache log bind mount (./logs/apache:/usr/local/apache2/logs).
# Without this, sshd's auth events stay inside the container — invisible to the
# SIEM unless an analyst runs `docker exec apache cat /var/log/auth.log`.
#
# Pattern mirrors luke_ws/vinzenz_ws/40-lab-persist.conf — auth.* facility
# routes to the persistent path AS WELL AS the in-container /var/log/auth.log
# (rsyslog evaluates all matching rules; the default Ubuntu/Debian rule still
# fires and writes /var/log/auth.log inside the container).
$ActionFileDefaultTemplate RSYSLOG_FileFormat
auth,authpriv.*    /usr/local/apache2/logs/auth.log
*.info;auth,authpriv.none,cron.none    /usr/local/apache2/logs/syslog
