ServerRoot "/usr/local/apache2"
Listen 80
Listen 443
ServerName apache

LoadModule mpm_prefork_module modules/mod_mpm_prefork.so
LoadModule authn_file_module modules/mod_authn_file.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule authz_groupfile_module modules/mod_authz_groupfile.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule access_compat_module modules/mod_access_compat.so
LoadModule auth_basic_module modules/mod_auth_basic.so
LoadModule reqtimeout_module modules/mod_reqtimeout.so
LoadModule filter_module modules/mod_filter.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule env_module modules/mod_env.so
LoadModule headers_module modules/mod_headers.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule version_module modules/mod_version.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule status_module modules/mod_status.so
LoadModule autoindex_module modules/mod_autoindex.so
LoadModule dir_module modules/mod_dir.so
LoadModule alias_module modules/mod_alias.so
LoadModule cgi_module modules/mod_cgi.so
# mod_rewrite — used by the :80 VirtualHost to permanent-redirect everything
# except /cgi-bin/ to HTTPS.
LoadModule rewrite_module modules/mod_rewrite.so
# mod_log_forensic emits a +token / -token pair around every request,
# letting a SIEM detect partial / hung requests and slow-loris-style
# probes that don't show up in the regular access log.
LoadModule log_forensic_module modules/mod_log_forensic.so
# TLS — real production Waystar Connect runs on HTTPS only. Noise and
# workstation curl traffic both target :443; the CVE-2021-42013 exploit
# also rides over TLS to mirror how a real attacker would deliver it.
# mod_socache_shmcb provides the in-memory SSL session cache mod_ssl needs.
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule ssl_module modules/mod_ssl.so

ServerAdmin webmaster@localhost

# Apache startet als root (zum Binden von Port 80), droppt dann auf
# www-data fuer alle Worker-Prozesse -> root priv nun mit priv esc.
User www-data
Group www-data

DocumentRoot "/opt/waystar-connect/dist"

<Directory />
    AllowOverride none
    Require all granted
</Directory>

<Directory "/opt/waystar-connect/dist">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

ScriptAlias /cgi-bin/ "/usr/local/apache2/cgi-bin/"

<Directory "/usr/local/apache2/cgi-bin">
    Options +ExecCGI
    AllowOverride None
    Require all granted
</Directory>

DirectoryIndex index.html

# LogLevel notice — matches what a security-tuned production webserver
# would actually run at. CGI errors and probe-level anomalies still show
# in error.log; every-request detail is already captured by CustomLog
# (combined format) and ForensicLog, so we don't pay info-level noise on
# top. SOC trainees get realistic volume instead of debug-level overload.
LogLevel notice
# Log to files inside ServerRoot/logs (= /usr/local/apache2/logs), which is bind-
# mounted to Infrastructure/logs/apache on the host so SIEM tooling can ingest
# persistent access/error logs across container recreates.
ErrorLog logs/error.log
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog logs/access.log combined
# ForensicLog: paired +token / -token entries per request, written to
# /usr/local/apache2/logs/forensic_log (bind-mounted to host).
ForensicLog logs/forensic_log

TypesConfig conf/mime.types

# ─────────────────────────────────────────────────────────── TLS / VHosts
# Self-signed cert generated at image build time (see apache/Dockerfile).
# CN=apache, SAN=DNS:apache,IP:10.40.0.2.
SSLSessionCache "shmcb:/usr/local/apache2/logs/ssl_scache(512000)"

# ── :443 — primary VirtualHost, serves the actual site + CGI ──
<VirtualHost _default_:443>
    ServerName apache
    DocumentRoot "/opt/waystar-connect/dist"

    SSLEngine on
    SSLCertificateFile      "/usr/local/apache2/conf/server.crt"
    SSLCertificateKeyFile   "/usr/local/apache2/conf/server.key"
    # Modern protocol/ciphers a real production tier would actually use.
    # TLSv1.2+ only — TLSv1/1.1 are deprecated and shouldn't show on the
    # wire in a 2026 lab.
    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite          HIGH:!aNULL:!MD5

    # Mirror the global directives so the exploit's /cgi-bin/ path is
    # served on TLS identically to plain HTTP.
    ScriptAlias /cgi-bin/ "/usr/local/apache2/cgi-bin/"
    <Directory "/usr/local/apache2/cgi-bin">
        Options +ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    # SSL access log (separate file so the TLS-vs-HTTP split is visible
    # to SIEM analysts who care about transport).
    CustomLog logs/access_ssl.log combined
    ErrorLog  logs/error_ssl.log
</VirtualHost>

# ── :80 — redirects everything to :443 EXCEPT /cgi-bin/ ──
# Real production redirects all HTTP to HTTPS for browsers. We keep the
# /cgi-bin/ path reachable on plain HTTP so the chain has flexibility
# (and so a SOC trainee sees BOTH transports for the exploit pattern,
# not just one). Real attackers probe whatever responds.
<VirtualHost _default_:80>
    ServerName apache
    DocumentRoot "/opt/waystar-connect/dist"

    # CGI mirror for the exploit surface.
    ScriptAlias /cgi-bin/ "/usr/local/apache2/cgi-bin/"
    <Directory "/usr/local/apache2/cgi-bin">
        Options +ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    # Everything else → permanent redirect to HTTPS so legacy/noise
    # clients land on the TLS endpoint.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/cgi-bin/
    RewriteRule ^/(.*)$ https://apache/$1 [R=301,L]
</VirtualHost>
