services:
  router:
    image: nginx:latest
    container_name: router
    ports:
      - "80:80"
    volumes:
      - ./router.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - public_net
      - internal_net
    depends_on:
      - nginx
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./html:/usr/share/nginx/html:ro
    networks:
      - internal_net
    restart: unless-stopped

  windows:
    image: dockurr/windows
    container_name: windows
    networks:
      - egress_net
      - internal_net
    environment:
      VERSION: "11l"
      USERNAME: ${WINDOWS_USERNAME}
      PASSWORD: ${WINDOWS_PASSWORD}
      RAM_SIZE: "4G"
      CPU_CORES: "2"
      DISK_SIZE: "64G"
    devices:
      - /dev/kvm
      - /dev/vhost-net
    device_cgroup_rules:
      - 'c *:* rwm'
    cap_add:
      - NET_ADMIN
    stop_grace_period: 2m
    restart: unless-stopped

  kali:
    image: kalilinux/kali-rolling
    container_name: kali
    command: sleep infinity
    tty: true
    stdin_open: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - public_net
    restart: unless-stopped

networks:
  public_net:
    driver: bridge
  egress_net:
    driver: bridge
  internal_net:
    driver: bridge
    internal: true
