services:
  router:
    build: ./router
    container_name: router
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.rp_filter=0
      - net.ipv4.conf.default.rp_filter=0
    ports:
      - "80:80"
    volumes:
      # Persist router logs (rsyslog + iptables LOG land in /var/log).
      - ./logs/router:/var/log
    networks:
      public_net:
        ipv4_address: 10.10.0.3
      internal_net:
        ipv4_address: 10.30.0.4
    depends_on:
      - apache
    restart: unless-stopped

  apache:
    build: ./apache
    # wir brauchen einen eigenen build um Dinge im Container selbst zu configurieren und nicht fertige images per httpd:2.4.50
    # muss nur httpd:2.4.50 intern nutzen 
    container_name: apache
    cap_add:
      - NET_ADMIN
    volumes:
      - ./apache/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
      - ./html:/usr/local/apache2/htdocs:ro
      - ./apache/cgi-bin:/usr/local/apache2/cgi-bin
      # Persist apache access/error logs (CustomLog + ErrorLog write here per httpd.conf).
      - ./logs/apache:/usr/local/apache2/logs
    networks:
      internal_net:
        ipv4_address: 10.30.0.2
      egress_net: {}
    restart: unless-stopped

  ubuntu_workstation:
    build: ./ubuntu_workstation
    container_name: ubuntu_workstation
    cap_add:
      # Required so auditd can load rules into the kernel audit subsystem.
      - AUDIT_CONTROL
      - AUDIT_READ
    security_opt:
      # Docker's default seccomp + AppArmor profiles both block audit_*
      # operations; auditd needs them to bind the netlink socket and set
      # daemon state. Lab-only — do not copy into production.
      - seccomp=unconfined
      - apparmor=unconfined
    ports:
      - "5901:5901"
    volumes:
      # Persist workstation logs (rsyslog + auditd land in /var/log; sshd VERBOSE → auth.log).
      - ./logs/workstation:/var/log
    networks:
      egress_net: {}
      internal_net:
        ipv4_address: 10.30.0.5
    restart: unless-stopped

  kali:
    build: ./kali
    container_name: kali
    command: sleep infinity
    tty: true
    stdin_open: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../Attack-chain:/Attack-chain
    networks:
      public_net:
        ipv4_address: 10.10.0.2
    restart: unless-stopped

networks:
  public_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24
  egress_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.0.0/24
  internal_net:
    driver: bridge
    # internal: true entfernt - Docker blockiert sonst IP-Forwarding
    # durch den Router-Container hindurch auf Host-Bridge-Ebene.
    ipam:
      config:
        - subnet: 10.30.0.0/24
