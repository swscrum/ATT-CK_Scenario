services:
  router:
    build: ./router
    container_name: router
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.rp_filter=0
      - net.ipv4.conf.default.rp_filter=0
    volumes:
      # Persist router logs (ulogd2 writes NFLOG packet captures to
      # /var/log/ulog-iptables.log; rsyslog/kernel events also land in
      # /var/log/kern.log when populated). Direct /var/log mount matches
      # how a real edge firewall ships its logs off-box.
      - ./logs/router:/var/log
    networks:
      public_net:
        ipv4_address: 10.10.0.3
      dmz_net:
        ipv4_address: 10.40.0.4
      internal_net:
        ipv4_address: 10.30.0.4
    depends_on:
      - apache
    restart: unless-stopped

  apache:
    build:
      context: .
      dockerfile: apache/Dockerfile
    # We need our own build so we can configure things inside the container,
    # rather than using the prebuilt httpd:2.4.50 image directly. The image
    # only has to USE httpd:2.4.50 internally as the FROM base.
    # Build context is Infrastructure/ so apache/Dockerfile can also COPY from shared-lab-keys/.
    container_name: apache
    cap_add:
      - NET_ADMIN
    # Port 80 is exposed here for host-browser convenience (localhost:80 → this
    # container directly). Docker sorts networks alphabetically, so docker-proxy
    # would connect to the router's internal_net IP and cause an eth1→eth1 hairpin
    # that the router's FORWARD rules don't cover. The attack chain from Kali still
    # goes through the router's iptables DNAT as intended.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./apache/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
      - ./apache/cgi-bin:/usr/local/apache2/cgi-bin
      # Persist apache access/error logs (CustomLog + ErrorLog write here per httpd.conf).
      - ./logs/apache:/usr/local/apache2/logs
    networks:
      # Apache lives in the DMZ. The only public-facing service in the lab.
      # Reachable from external (kali) only via the router's DNAT on :80, and
      # from internal (workstation) only via explicit router FORWARD rules.
      dmz_net:
        ipv4_address: 10.40.0.2
    # db-internal sits in internal_net (10.30.0.6). With apache in dmz_net,
    # Docker's embedded DNS no longer resolves `db-internal` here — but the
    # booking CGI (cgi-bin/book.py) connects via PGHOST=db-internal.
    extra_hosts:
      - "db-internal:10.30.0.6"
    restart: unless-stopped

  ubuntu_workstation:
    build:
      context: .
      dockerfile: ubuntu_workstation/Dockerfile
    # context is Infrastructure/ so ubuntu_workstation/Dockerfile can also COPY from shared-lab-keys/
    container_name: ubuntu_workstation
    cap_add:
      - NET_ADMIN
    environment:
      # Drives activity_sim.py inside this container. Set to "1" by
      # tools/run.sh when --pacing realistic; "0" in fast mode so CI
      # doesn't generate baseline noise that's never read.
      ACTIVITY_ENABLED: "${ACTIVITY_ENABLED:-0}"
    ports:
      - "5901:5901"
    volumes:
      # Persist workstation logs (rsyslog mirrors syslog + auth.log to
      # /var/log/persist, and the inotify FIM watcher writes lab-fim.log
      # there; sshd VERBOSE → auth.log). /var/log itself is NOT bind-mounted
      # to avoid changing host directory ownership.
      - ./logs/workstation:/var/log/persist
    networks:
      internal_net:
        ipv4_address: 10.30.0.5
    # apache lives in dmz_net now, so Docker's embedded DNS no longer resolves
    # `apache` from inside this container. Story/scripts (package.json deploy,
    # docs/deploy.md, ~john.stravidis/.ssh/config) all use the hostname, so we
    # pin it to the DMZ IP.
    extra_hosts:
      - "apache:10.40.0.2"
    restart: unless-stopped

  luke_ws:
    build:
      context: .
      dockerfile: luke_ws/Dockerfile
    container_name: luke_ws
    cap_add:
      - NET_ADMIN
    environment:
      ACTIVITY_ENABLED: "${ACTIVITY_ENABLED:-0}"
    volumes:
      # Mirror of the workstation logging pattern. rsyslog inside the
      # container writes /var/log/syslog + /var/log/auth.log as usual;
      # 40-lab-persist.conf duplicates them to /var/log/persist which
      # is bind-mounted here so the SOC can ingest.
      - ./logs/luke_ws:/var/log/persist
    networks:
      internal_net:
        ipv4_address: 10.30.0.7
    # apache lives in dmz_net, so Docker's embedded DNS doesn't resolve
    # `apache` from this internal-only container. Luke's seeded
    # ~/.ssh/config and ~/.bash_history use the hostname for ssh/rsync/curl,
    # so we pin it to the DMZ IP (same pattern as ubuntu_workstation).
    extra_hosts:
      - "apache:10.40.0.2"
    restart: unless-stopped

  vinzenz_ws:
    build:
      context: .
      dockerfile: vinzenz_ws/Dockerfile
    container_name: vinzenz_ws
    cap_add:
      - NET_ADMIN
    environment:
      ACTIVITY_ENABLED: "${ACTIVITY_ENABLED:-0}"
    volumes:
      - ./logs/vinzenz_ws:/var/log/persist
    networks:
      internal_net:
        ipv4_address: 10.30.0.8
    # Same DNS pinning as luke_ws: Vinzenz's ~/.ssh/config + inventory.ini
    # reference `apache` by name for fleet management.
    extra_hosts:
      - "apache:10.40.0.2"
    restart: unless-stopped

  db-internal:
    build:
      context: .
      dockerfile: db-internal/Dockerfile
    container_name: db-internal
    cap_add:
      - NET_ADMIN
    environment:
      # Privileged owner — credentials live on Vinzenz's workstation (vinzenz_ws).
      # waystar-readonly (ChangeMe!2026) is breadcrumbed on John's workstation
      # AND on Luke's workstation (~luke.smith/.pgpass — Luke uses it daily).
      POSTGRES_DB: waystar
      POSTGRES_USER: waystar
      POSTGRES_PASSWORD: "WaystarDB!Secure2024"
    command:
      - "postgres"
      - "-c"
      - "logging_collector=on"
      - "-c"
      - "log_directory=/var/log/postgres"
      - "-c"
      - "log_filename=postgresql-%Y-%m-%d.log"
      - "-c"
      - "log_connections=on"
      - "-c"
      - "log_disconnections=on"
      - "-c"
      - "log_line_prefix=%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h "
      - "-c"
      - "log_statement=all"
    volumes:
      # Persist Postgres logs so the SIEM-readable trail survives container restarts.
      - ./logs/db:/var/log/postgres
    networks:
      internal_net:
        ipv4_address: 10.30.0.6
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────────────
  # lab_dns — workstation DNS resolver. Replaces Docker's embedded DNS for
  # the three internal workstations so their lookups for fake "internet"
  # domains (github.com, archive.ubuntu.com, etc.) resolve to fake_internet,
  # AND so every query gets logged. Dual-homed on internal_net + public_net.
  # See Infrastructure/lab_dns/dnsmasq.hosts for the canonical resolution
  # table.
  # ──────────────────────────────────────────────────────────────────────

  lab_dns:
    build: ./lab_dns
    container_name: lab_dns
    cap_add:
      - NET_ADMIN
    networks:
      internal_net:
        ipv4_address: 10.30.0.10
      public_net:
        ipv4_address: 10.10.0.10
    depends_on:
      - router
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────────────
  # fake_internet — single-IP simulation of "the internet" for workstation
  # outbound traffic. Routes by Host header to return realistic shapes per
  # "domain" (github API JSON, npm registry JSON, apt InRelease text, etc).
  # All domains terminate here via lab_dns. Cert signed by lab CA so
  # workstation curl/wget succeeds without -k.
  # ──────────────────────────────────────────────────────────────────────

  fake_internet:
    build:
      context: .
      dockerfile: fake_internet/Dockerfile
    container_name: fake_internet
    cap_add:
      - NET_ADMIN
    volumes:
      # Bind nginx logs to host so the SIEM can see workstation outbound
      # request shapes (host header, path, status, client IP, UA).
      - ./logs/fake_internet:/var/log/nginx
    networks:
      public_net:
        ipv4_address: 10.10.0.11
    depends_on:
      - router
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────────────
  # Background noise — four containers sharing the same image, each driven
  # by NOISE_PERSONA. Different IPs + monomorphic behaviour per persona
  # means a SOC trainee can't filter by IP or by UA alone; they have to
  # learn behavioural pattern analysis. See Infrastructure/noise_user_sim/
  # noise.py PERSONAS dict for full per-persona config.
  # ──────────────────────────────────────────────────────────────────────

  noise_user_sim:
    build: ./noise_user_sim
    container_name: noise_user_sim
    cap_add:
      # NET_ADMIN for the `ip route add 10.40.0.0/24` at startup so the
      # container can reach apache via the router. Real internet hosts have
      # this routing implicitly via their default gateway.
      - NET_ADMIN
    environment:
      # Set to "1" only when run.sh receives --pacing realistic. With "0"
      # the container stays up (signal.pause) but generates no traffic, so
      # we don't pollute fast-mode runs with background HTTP.
      NOISE_ENABLED: "${NOISE_ENABLED:-0}"
      NOISE_PERSONA: "general"
      NOISE_TARGET: "router"
    networks:
      # public_net at 10.10.0.5 — DIFFERENT from kali (10.10.0.2). General
      # human browsing: LEGIT_PATHS, HUMAN_UAS, 30-120s intervals, 3 threads.
      public_net:
        ipv4_address: 10.10.0.5
    depends_on:
      - router
      - apache
    restart: unless-stopped

  noise_monitor:
    build: ./noise_user_sim
    container_name: noise_monitor
    cap_add:
      - NET_ADMIN
    environment:
      NOISE_ENABLED: "${NOISE_ENABLED:-0}"
      NOISE_PERSONA: "monitor"
      NOISE_TARGET: "router"
    networks:
      # Uptime monitor: hits /api/health every ~60s with a single UA.
      # Distinctive cadence — exactly the kind of regular-interval traffic
      # a SOC analyst sees from Pingdom/UptimeRobot/etc.
      public_net:
        ipv4_address: 10.10.0.6
    depends_on:
      - router
      - apache
    restart: unless-stopped

  noise_scanner:
    build: ./noise_user_sim
    container_name: noise_scanner
    cap_add:
      - NET_ADMIN
    environment:
      NOISE_ENABLED: "${NOISE_ENABLED:-0}"
      NOISE_PERSONA: "scanner"
      NOISE_TARGET: "router"
    networks:
      # Internet background scanner: PROBE_PATHS + BOT_UAS, 60-300s intervals.
      # 404-yielding probes that look suspicious but are NOT the attacker.
      # Teaches "suspicious surface anomaly != malicious".
      public_net:
        ipv4_address: 10.10.0.7
    depends_on:
      - router
      - apache
    restart: unless-stopped

  noise_mobile:
    build: ./noise_user_sim
    container_name: noise_mobile
    cap_add:
      - NET_ADMIN
    environment:
      NOISE_ENABLED: "${NOISE_ENABLED:-0}"
      NOISE_PERSONA: "mobile"
      NOISE_TARGET: "router"
    networks:
      # Mobile browsing: same paths as general but mobile UAs and sparse
      # cadence (300-900s). Teaches that legit cadence varies wildly.
      public_net:
        ipv4_address: 10.10.0.8
    depends_on:
      - router
      - apache
    restart: unless-stopped

  kali:
    build: ./kali
    container_name: kali
    cap_add:
      # NET_ADMIN lets kali modify its own routing table at startup so
      # 10.30.0.0/24 + 10.40.0.0/24 traffic is sent to the router instead
      # of Docker's bridge gateway. Realistic — an attacker has admin on
      # their own host. (Also required for nmap, whose binary has file
      # caps cap_net_admin=eip and would fail with EPERM if the bounding
      # set lacked it.)
      - NET_ADMIN
    # Add static routes so kali (the attacker host) can reach DMZ + Internal
    # via the router. Without this, kali's default gateway is Docker's
    # public_net bridge (10.10.0.1), which doesn't know about 10.30.0.0/24
    # or 10.40.0.0/24 — packets to those subnets get dropped before they
    # ever reach the router's iptables FORWARD chain. In a real network,
    # an attacker on the firewall's external interface would have these
    # routes implicitly (default-gw points at the firewall); the lab
    # models that explicitly so the External→Internal rules are exercisable
    # from kali instead of needing a separate scanner container.
    command: >
      sh -c "
        ip route add 10.30.0.0/24 via 10.10.0.3 || true ;
        ip route add 10.40.0.0/24 via 10.10.0.3 || true ;
        exec sleep infinity
      "
    tty: true
    stdin_open: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../Attack-chain:/Attack-chain
      - ./logs/attacker:/Infrastructure/logs/attacker  # must run docker-compose from Infrastructure/
      - ./shared-lab-keys:/shared-lab-keys:ro
      - sliver-server-data:/root/.sliver
      - sliver-client-data:/root/.sliver-client
    networks:
      public_net:
        ipv4_address: 10.10.0.2
    restart: unless-stopped

networks:
  # External zone — kali (attacker) and the router's outside leg.
  public_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24
  # DMZ — only apache lives here, plus the router's middle leg. External
  # reaches apache only via the router's :80 DNAT. apache↔workstation traffic
  # must now traverse the router (lateral SSH becomes loggable at L3).
  dmz_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.40.0.0/24
  # Internal zone — workstations and the router's inside leg.
  internal_net:
    driver: bridge
    # `internal: true` removed — Docker would otherwise block IP forwarding
    # through the router container at the host bridge level.
    ipam:
      config:
        - subnet: 10.30.0.0/24

volumes:
  sliver-server-data:
  sliver-client-data:
