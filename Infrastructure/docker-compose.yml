services:
  router:
    build: ./router
    container_name: router
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.rp_filter=0
      - net.ipv4.conf.default.rp_filter=0
    networks:
      public_net:
        ipv4_address: 10.10.0.3
      dmz_net:
        ipv4_address: 10.40.0.4
      internal_net:
        ipv4_address: 10.30.0.4
    depends_on:
      - apache
    restart: unless-stopped

  apache:
    build:
      context: .
      dockerfile: apache/Dockerfile
    # We need our own build so we can configure things inside the container,
    # rather than using the prebuilt httpd:2.4.50 image directly. The image
    # only has to USE httpd:2.4.50 internally as the FROM base.
    # Build context is Infrastructure/ so apache/Dockerfile can also COPY from shared-lab-keys/.
    container_name: apache
    cap_add:
      - NET_ADMIN
    volumes:
      - ./apache/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
      - ./apache/cgi-bin:/usr/local/apache2/cgi-bin
      # Persist apache access/error logs (CustomLog + ErrorLog write here per httpd.conf).
      - ./logs/apache:/usr/local/apache2/logs
    networks:
      # Apache lives in the DMZ. The only public-facing service in the lab.
      # Reachable from external (kali) only via the router's DNAT on :80, and
      # from internal (workstation) only via explicit router FORWARD rules.
      dmz_net:
        ipv4_address: 10.40.0.2
    restart: unless-stopped

  ubuntu_workstation:
    build:
      context: .
      dockerfile: ubuntu_workstation/Dockerfile
    # context is Infrastructure/ so ubuntu_workstation/Dockerfile can also COPY from shared-lab-keys/
    container_name: ubuntu_workstation
    cap_add:
      - NET_ADMIN
    ports:
      - "5901:5901"
    volumes:
      # Persist workstation logs (rsyslog mirrors syslog + auth.log to
      # /var/log/persist, and the inotify FIM watcher writes lab-fim.log
      # there; sshd VERBOSE → auth.log). /var/log itself is NOT bind-mounted
      # to avoid changing host directory ownership.
      - ./logs/workstation:/var/log/persist
    networks:
      internal_net:
        ipv4_address: 10.30.0.5
    # apache lives in dmz_net now, so Docker's embedded DNS no longer resolves
    # `apache` from inside this container. Story/scripts (package.json deploy,
    # docs/deploy.md, ~john.stravidis/.ssh/config) all use the hostname, so we
    # pin it to the DMZ IP.
    extra_hosts:
      - "apache:10.40.0.2"
    restart: unless-stopped

  kali:
    build: ./kali
    container_name: kali
    command: sleep infinity
    tty: true
    stdin_open: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../Attack-chain:/Attack-chain
      - ./shared-lab-keys:/shared-lab-keys:ro
    networks:
      public_net:
        ipv4_address: 10.10.0.2
    restart: unless-stopped

networks:
  # External zone — kali (attacker) and the router's outside leg.
  public_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24
  # DMZ — only apache lives here, plus the router's middle leg. External
  # reaches apache only via the router's :80 DNAT. apache↔workstation traffic
  # must now traverse the router (lateral SSH becomes loggable at L3).
  dmz_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.40.0.0/24
  # Internal zone — workstations and the router's inside leg.
  internal_net:
    driver: bridge
    # `internal: true` removed — Docker would otherwise block IP forwarding
    # through the router container at the host bridge level.
    ipam:
      config:
        - subnet: 10.30.0.0/24
