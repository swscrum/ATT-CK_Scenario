services:
  router:
    build: ./router
    container_name: router
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.rp_filter=0
      - net.ipv4.conf.default.rp_filter=0
    networks:
      public_net:
        ipv4_address: 10.10.0.3
      internal_net:
        ipv4_address: 10.30.0.4
    depends_on:
      - apache
    restart: unless-stopped

  apache:
    build:
      context: .
      dockerfile: apache/Dockerfile
    # We need our own build so we can configure things inside the container,
    # rather than using the prebuilt httpd:2.4.50 image directly. The image
    # only has to USE httpd:2.4.50 internally as the FROM base.
    # Build context is Infrastructure/ so apache/Dockerfile can also COPY from shared-lab-keys/.
    container_name: apache
    cap_add:
      - NET_ADMIN
    # Port 80 is exposed here for host-browser convenience (localhost:80 → this
    # container directly). Docker sorts networks alphabetically, so docker-proxy
    # would connect to the router's internal_net IP and cause an eth1→eth1 hairpin
    # that the router's FORWARD rules don't cover. The attack chain from Kali still
    # goes through the router's iptables DNAT as intended.
    ports:
      - "80:80"
    volumes:
      - ./apache/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
      - ./apache/cgi-bin:/usr/local/apache2/cgi-bin
      # Persist apache access/error logs (CustomLog + ErrorLog write here per httpd.conf).
      - ./logs/apache:/usr/local/apache2/logs
    networks:
      internal_net:
        ipv4_address: 10.30.0.2
      egress_net: {}
    restart: unless-stopped

  ubuntu_workstation:
    build:
      context: .
      dockerfile: ubuntu_workstation/Dockerfile
    # context is Infrastructure/ so ubuntu_workstation/Dockerfile can also COPY from shared-lab-keys/
    container_name: ubuntu_workstation
    cap_add:
      - NET_ADMIN
    ports:
      - "5901:5901"
    volumes:
      # Persist workstation logs (rsyslog mirrors syslog + auth.log to
      # /var/log/persist, and the inotify FIM watcher writes lab-fim.log
      # there; sshd VERBOSE → auth.log). /var/log itself is NOT bind-mounted
      # to avoid changing host directory ownership.
      - ./logs/workstation:/var/log/persist
    networks:
      egress_net: {}
      internal_net:
        ipv4_address: 10.30.0.5
    restart: unless-stopped

  db-internal:
    build:
      context: .
      dockerfile: db-internal/Dockerfile
    container_name: db-internal
    cap_add:
      - NET_ADMIN
    environment:
      # Privileged owner — credentials live on Hans's workstation (sysadmin_ws).
      # waystar-readonly (ChangeMe!2026) is breadcrumbed on John's workstation.
      POSTGRES_DB: waystar
      POSTGRES_USER: waystar
      POSTGRES_PASSWORD: "WaystarDB!Secure2024"
    command:
      - "postgres"
      - "-c"
      - "logging_collector=on"
      - "-c"
      - "log_directory=/var/log/postgres"
      - "-c"
      - "log_filename=postgresql-%Y-%m-%d.log"
      - "-c"
      - "log_connections=on"
      - "-c"
      - "log_disconnections=on"
      - "-c"
      - "log_line_prefix=%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h "
      - "-c"
      - "log_statement=all"
    volumes:
      # Persist Postgres logs so the SIEM-readable trail survives container restarts.
      - ./logs/db:/var/log/postgres
    networks:
      internal_net:
        ipv4_address: 10.30.0.6
    restart: unless-stopped

  kali:
    build: ./kali
    container_name: kali
    command: sleep infinity
    tty: true
    stdin_open: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../Attack-chain:/Attack-chain
      - ./shared-lab-keys:/shared-lab-keys:ro
    networks:
      public_net:
        ipv4_address: 10.10.0.2
    restart: unless-stopped

networks:
  public_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24
  egress_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.0.0/24
  internal_net:
    driver: bridge
    # `internal: true` removed — Docker would otherwise block IP forwarding
    # through the router container at the host bridge level.
    ipam:
      config:
        - subnet: 10.30.0.0/24
