services:
  router:
    build: ./router
    container_name: router
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.rp_filter=0
      - net.ipv4.conf.default.rp_filter=0
    ports:
      - "80:80"
    networks:
      - public_net
      - internal_net
    depends_on:
      - apache
    restart: unless-stopped

  apache:
    build: ./apache
    # wir brauchen einen eigenen build um Dinge im Container selbst zu configurieren und nicht fertige images per httpd:2.4.50
    # muss nur httpd:2.4.50 intern nutzen 
    container_name: apache
    cap_add:
      - NET_ADMIN
    volumes:
      - ./apache/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
      - ./html:/usr/local/apache2/htdocs:ro
      - ./apache/cgi-bin:/usr/local/apache2/cgi-bin
    networks:
      - internal_net
    restart: unless-stopped

  windows:
    image: dockurr/windows
    container_name: windows
    ports:
      - "8806:3389"
    networks:
      - egress_net
      - internal_net
    environment:
      VERSION: "11l"
      USERNAME: ${WINDOWS_USERNAME}
      PASSWORD: ${WINDOWS_PASSWORD}
      RAM_SIZE: "4G"
      CPU_CORES: "2"
      DISK_SIZE: "64G"
    devices:
      - /dev/kvm
      - /dev/vhost-net
    device_cgroup_rules:
      - 'c *:* rwm'
    cap_add:
      - NET_ADMIN
    stop_grace_period: 2m
    volumes:
      - windows_storage:/storage
    restart: unless-stopped

  kali:
    image: kalilinux/kali-rolling
    container_name: kali
    command: sleep infinity
    tty: true
    stdin_open: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - public_net
    restart: unless-stopped

networks:
  public_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24
  egress_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.0.0/24
  internal_net:
    driver: bridge
    # internal: true entfernt - Docker blockiert sonst IP-Forwarding
    # durch den Router-Container hindurch auf Host-Bridge-Ebene.
    ipam:
      config:
        - subnet: 10.30.0.0/24

volumes:
  windows_storage:
