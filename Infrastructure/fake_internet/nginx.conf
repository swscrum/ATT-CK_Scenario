user nginx;
worker_processes auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Extended access-log format — captures the Host header so the SIEM can
    # tell which "domain" each request claimed to be hitting (the same
    # client IP hits multiple domains across a workday).
    log_format fake_internet
        '$remote_addr - - [$time_local] "$request" $status $body_bytes_sent '
        '"$host" "$http_user_agent"';
    access_log /var/log/nginx/access.log fake_internet;

    sendfile on;
    keepalive_timeout 30;

    # Shared SSL config used by the :443 vhost. Single cert with multi-SAN
    # covers every public-looking domain dnsmasq points here.
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── :80 — package-manager metadata (`apt update` uses plain HTTP) ──
    # apt fetches InRelease + Packages over HTTP by design (the files are
    # signed at the apt level, not the transport level); we serve a few
    # tiny fake mirror documents so `apt update` doesn't error out.
    server {
        listen 80 default_server;
        server_name _;
        root /usr/share/nginx/html/fixtures;

        # apt InRelease / Packages — return a fake-but-parseable 200.
        location ~ ^/(ubuntu|debian)/dists/.*/InRelease$ {
            default_type text/plain;
            return 200 "Origin: Ubuntu\nLabel: Ubuntu\nSuite: jammy\nCodename: jammy\nDate: Mon, 02 Jun 2026 12:00:00 UTC\nArchitectures: amd64\nComponents: main restricted universe multiverse\nDescription: Ubuntu Jammy 22.04 LTS (lab simulation)\n";
        }
        location ~ ^/(ubuntu|debian)/dists/ {
            default_type text/plain;
            return 200 "Package: lab-fake\nVersion: 1.0\nArchitecture: all\nMaintainer: Waystar Lab\nDescription: lab fixture package list\n";
        }

        # Catch-all 200 for HTTP — apt sometimes does HEAD probes, package
        # tooling does connectivity checks, etc.
        location / {
            return 200 'fake_internet HTTP endpoint\n';
            add_header Content-Type text/plain;
        }
    }

    # ── :443 — TLS-everywhere domains; route by Host header ──
    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Default response for any Host: header we don't explicitly route.
        # Empty 200 — keeps `curl https://something.lab.example/` from erroring
        # while still showing up in the log.
        location / {
            default_type text/plain;
            return 200 'fake_internet default response\n';
        }
    }

    # GitHub API — returns JSON for repo/commits/etc.
    server {
        listen 443 ssl;
        server_name github.com api.github.com raw.githubusercontent.com;

        location /repos/ {
            default_type application/json;
            return 200 '{"name":"connect","full_name":"waystar/connect","private":false,"description":"Waystar Connect frontend","default_branch":"main","stargazers_count":3}';
        }
        location ~ ^/.+/.+/commits {
            default_type application/json;
            return 200 '[{"sha":"a1b2c3d","commit":{"author":{"name":"John Stravidis","date":"2026-05-30T10:23:00Z"},"message":"Fix booking validation"}}]';
        }
        location / {
            default_type application/json;
            return 200 '{"current_user_url":"https://api.github.com/user","repository_url":"https://api.github.com/repos/{owner}/{repo}"}';
        }
    }

    # npm registry — returns JSON for package lookups.
    server {
        listen 443 ssl;
        server_name registry.npmjs.org;

        location ~ ^/([^/]+)$ {
            default_type application/json;
            return 200 '{"name":"$1","dist-tags":{"latest":"4.18.2"},"versions":{"4.18.2":{"name":"$1","version":"4.18.2"}}}';
        }
        location / {
            default_type application/json;
            return 200 '{"db_name":"registry","doc_count":1923847}';
        }
    }

    # Slack — heartbeat / auth.test returns simple JSON.
    server {
        listen 443 ssl;
        server_name slack.com api.slack.com;

        location /api/auth.test {
            default_type application/json;
            return 200 '{"ok":true,"url":"https://waystar.slack.com/","team":"Waystar","user":"lab-bot","team_id":"T01","user_id":"U01"}';
        }
        location / {
            default_type application/json;
            return 200 '{"ok":true}';
        }
    }

    # Ubuntu connectivity check — NetworkManager polls this; expects 204.
    server {
        listen 443 ssl;
        server_name connectivity-check.ubuntu.com;

        location / {
            return 204;
        }
    }

    # NTP-like TCP probe target — workstations sometimes do TCP/443 to
    # time servers as a fallback connectivity check.
    server {
        listen 443 ssl;
        server_name time.cloudflare.com;

        location / {
            default_type text/plain;
            return 200 '';
        }
    }

    # Ubuntu apt mirror over TLS (some configurations prefer https for apt).
    server {
        listen 443 ssl;
        server_name archive.ubuntu.com security.ubuntu.com;

        # Mirror the plain-HTTP InRelease behaviour on TLS too.
        location ~ ^/.+/dists/.*/InRelease$ {
            default_type text/plain;
            return 200 "Origin: Ubuntu\nLabel: Ubuntu\nSuite: jammy\nCodename: jammy\nDate: Mon, 02 Jun 2026 12:00:00 UTC\nArchitectures: amd64\nComponents: main restricted universe multiverse\n";
        }
        location / {
            default_type text/plain;
            return 200 'Ubuntu mirror (lab fixture)\n';
        }
    }
}
