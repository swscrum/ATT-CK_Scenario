# dnsmasq config for the Waystar lab DNS resolver.
#
# What's special:
#   - addn-hosts: a static hostfile is the ONLY source of truth.
#     Everything else NXDOMAINs (including the attacker's eventual C2 domain
#     unless it ends up on this list — which it shouldn't).
#   - no-resolv: we deliberately don't forward upstream. There's no real
#     "internet" — the lab simulates it via the fake_internet container.
#   - log-queries: every A/AAAA query is logged with the source IP and the
#     queried name. Captured via `docker logs lab_dns` + tools/run.sh
#     snapshot. This is the central SIEM source for unfamiliar-domain
#     detection.
#   - keep-in-foreground + log-facility=- sends logs to stdout, the
#     idiomatic container shape.

addn-hosts=/etc/dnsmasq.hosts
no-resolv
bogus-priv
domain-needed
log-queries
log-facility=-
keep-in-foreground

# Listen on all interfaces (lab_dns is dual-homed to internal_net + public_net).
# Workstations resolve via the internal_net leg (10.30.0.10); nothing on
# public_net is configured to query us, but the listener doesn't cost
# anything.
interface=eth0
interface=eth1
bind-interfaces

# Suppress upstream DNS retries — there's no upstream. NXDOMAIN immediately
# for anything not in dnsmasq.hosts.
no-poll
