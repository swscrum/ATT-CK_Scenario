# /etc/rsyslog.d/40-lab-persist.conf
# Mirror key telemetry to the host-persisted bind-mount (/var/log/persist).
# /var/log itself is NOT bind-mounted, so rsyslog retains standard ownership
# of its default targets (/var/log/syslog, /var/log/auth.log) inside the
# container without touching host-side directory permissions.
$ActionFileDefaultTemplate RSYSLOG_FileFormat
auth,authpriv.*                 /var/log/persist/auth.log
*.* ;auth,authpriv.none         /var/log/persist/syslog
