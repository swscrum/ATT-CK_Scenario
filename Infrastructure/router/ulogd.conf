# ulogd2 configuration for the lab router.
#
# Captures iptables NFLOG events (group 1) and writes them as human-readable
# lines to /var/log/ulog-iptables.log, which is bind-mounted to
# Infrastructure/logs/router on the host so the SOC can ingest them.
#
# Why NFLOG instead of plain `iptables -j LOG`:
#   `LOG` writes to the kernel ring buffer, which is host-wide in Docker
#   (containers share the host kernel). The router can't see its own LOG
#   messages because /dev/kmsg leaks every container's traffic. NFLOG is a
#   userspace netlink target, fully container-isolated.

[global]
logfile="/var/log/ulogd.log"
loglevel=5

# Stack: NFLOG → enrich with interface index + IP-string → emit packet line
stack=log1:NFLOG,base1:BASE,ifi1:IFINDEX,ip2str1:IP2STR,print1:PRINTPKT,emu1:LOGEMU

[log1]
group=1

[emu1]
file="/var/log/ulog-iptables.log"
sync=1
