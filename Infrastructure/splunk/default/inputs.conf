# Splunk monitor stanzas for the ATT&CK lab.
# Mount the host-side log directory into the Splunk container at /opt/logs,
# then drop this TA into $SPLUNK_HOME/etc/apps/cyberlab_ta/.
#
# docker-compose.yml bind-mount reference (add to the splunk service):
#   volumes:
#     - ./logs:/opt/logs:ro

[monitor:///opt/logs/attacker/attack_steps_*.log]
sourcetype = attacker_chain
index = cyberlab

[monitor:///opt/logs/apache/access.log]
sourcetype = access_combined
index = cyberlab

[monitor:///opt/logs/apache/auth.log]
sourcetype = linux_secure
index = cyberlab

[monitor:///opt/logs/apache/syslog]
sourcetype = syslog
index = cyberlab

[monitor:///opt/logs/apache/lab-fim.log]
sourcetype = lab_fim
index = cyberlab

[monitor:///opt/logs/workstation/auth.log]
sourcetype = linux_secure
index = cyberlab

[monitor:///opt/logs/workstation/syslog]
sourcetype = syslog
index = cyberlab

[monitor:///opt/logs/workstation/lab-fim.log]
sourcetype = lab_fim
index = cyberlab

[monitor:///opt/logs/vinzenz_ws/auth.log]
sourcetype = linux_secure
index = cyberlab

[monitor:///opt/logs/vinzenz_ws/syslog]
sourcetype = syslog
index = cyberlab

[monitor:///opt/logs/vinzenz_ws/lab-fim.log]
sourcetype = lab_fim
index = cyberlab

[monitor:///opt/logs/luke_ws/auth.log]
sourcetype = linux_secure
index = cyberlab

[monitor:///opt/logs/luke_ws/syslog]
sourcetype = syslog
index = cyberlab

[monitor:///opt/logs/luke_ws/lab-fim.log]
sourcetype = lab_fim
index = cyberlab

[monitor:///opt/logs/router/ulog-iptables.log]
sourcetype = ulog_iptables
index = cyberlab

[monitor:///opt/logs/db/postgresql-*.log]
sourcetype = postgresql
index = cyberlab
