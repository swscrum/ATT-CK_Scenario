# Sourcetype definitions for the ATT&CK lab.
# Timestamp formats match what each log producer emits after the lab config
# changes in this PR (ISO-8601 throughout, except ulog which stays BSD).

[attacker_chain]
# 2026-06-15T14:25:35.123456+00:00 kali attacker[<run_id>]: event_type=...
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6N%:z
TIME_PREFIX = ^
MAX_TIMESTAMP_LOOKAHEAD = 32
KV_MODE = none
REPORT-attacker_chain_fields = attacker_chain_kv

[lab_fim]
# 2026-05-17T18:47:07+0000 tag=lab_fim host=john_ws path=... event=...
TIME_FORMAT = %Y-%m-%dT%H:%M:%S%z
TIME_PREFIX = ^
MAX_TIMESTAMP_LOOKAHEAD = 26
KV_MODE = none
REPORT-lab_fim_fields = lab_fim_kv

[linux_secure]
# After rsyslog $ActionFileDefaultTemplate RSYSLOG_FileFormat:
# 2026-06-11T20:01:21.123456+00:00 hostname sshd[12345]: ...
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6N%:z
TIME_PREFIX = ^
MAX_TIMESTAMP_LOOKAHEAD = 32

[ulog_iptables]
# BSD syslog from ulogd2 LOGEMU: Jun 11 20:01:21 host FW-NEW: ...
# Splunk built-in BSD parsing handles this; anchor year to ingest time.
DATETIME_CONFIG = CURRENT

[postgresql]
# 2026-05-18 15:56:57 UTC [pid] user@db: statement: SELECT ...
TIME_FORMAT = %Y-%m-%d %H:%M:%S %Z
TIME_PREFIX = ^
MAX_TIMESTAMP_LOOKAHEAD = 24
