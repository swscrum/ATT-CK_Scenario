# Field extractions for ATT&CK lab sourcetypes.
# Used by REPORT- stanzas in props.conf.

[attacker_chain_kv]
# Extracts both: event_type=cmd_exec  and  cmd="curl -X POST ..."
REGEX = (\w+)=(?:"([^"]*)"|(\S+))
FORMAT = $1::$2$3
MV_ADD = true

[lab_fim_kv]
# All lab-fim values are unquoted space-free tokens: tag=lab_fim host=john_ws ...
REGEX = (\w+)=(\S+)
FORMAT = $1::$2
MV_ADD = true
