# /etc/rsyslog.d/01-lab-perms.conf
#
# Default rsyslog file mode in Ubuntu is 0640 root:adm — appropriate for
# real production where a SIEM agent (running as root or in adm group)
# ships the logs off-host. In this lab the operator inspects /var/log
# files directly from the host shell as the unprivileged joe user, so
# we relax to 0644 (group/ownership unchanged) just for the world-read
# bit. Group=adm and owner=root are preserved → realistic apart from
# that single DAC bit.
$FileCreateMode 0644
$DirCreateMode  0755
