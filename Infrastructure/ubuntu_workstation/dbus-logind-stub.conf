<!DOCTYPE busconfig PUBLIC
  "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Policy file for the container logind stub (logind-stub.py).

  The D-Bus system bus denies ownership of service names by default. This
  file grants root the right to own org.freedesktop.login1 so the stub can
  register as a no-op logind service and satisfy xfce4-panel's clock plugin,
  which probes the interface at startup to subscribe to PrepareForSleep signals.

  All users are additionally allowed to send to / receive from the stub so
  XFCE components running as john.stravidis can query the interface.
-->
<busconfig>
  <policy user="root">
    <allow own="org.freedesktop.login1"/>
    <allow send_destination="org.freedesktop.login1"/>
    <allow receive_sender="org.freedesktop.login1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.freedesktop.login1"/>
    <allow receive_sender="org.freedesktop.login1"/>
  </policy>
</busconfig>
