# vinzenz.fedora's .tmux.conf
# Sysadmin layout — three named long-running sessions:
#   fleet      ssh + ansible across the workstations
#   db         psql + monitoring against db-internal
#   apache     watching apache logs + http checks

# Prefix to Ctrl-a (Ctrl-b conflicts with screen muscle memory)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Reload config without restarting tmux
bind r source-file ~/.tmux.conf \; display "tmux config reloaded"

# Start window/pane numbering at 1 (easier than 0 on the keyboard)
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Visible activity on background windows
setw -g monitor-activity on
set -g visual-activity off

# Large scrollback for chasing log tails
set -g history-limit 50000

# Status bar — minimal, host + session, time on the right
set -g status-style fg=white,bg=black
set -g status-left-length 25
set -g status-right-length 60
set -g status-left  '#[fg=cyan,bold][#H] #[fg=yellow]#S #[default]'
set -g status-right '#[fg=cyan]%Y-%m-%d %H:%M:%SZ#[default]'

# Window titles
setw -g window-status-current-style fg=black,bg=cyan,bold

# Mouse support (occasional)
set -g mouse on

# Splits use the current pane's dir
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"

# Pane navigation w/o prefix (Alt+arrows)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
