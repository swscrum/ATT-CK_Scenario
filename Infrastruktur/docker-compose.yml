version: "3.9"

services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./html:/usr/share/nginx/html:ro
    networks:
      - public_net
      - internal_net
    restart: unless-stopped

  windows:
    image: dockurr/windows
    container_name: windows
    environment:
      VERSION: "11l"
      USERNAME: ${WINDOWS_USERNAME}
      PASSWORD: ${WINDOWS_PASSWORD}
      RAM_SIZE: "4G"
      CPU_CORES: "2"
      DISK_SIZE: "64G"
      DHCP: "Y"
    devices:
      - /dev/kvm
      - /dev/vhost-net
    device_cgroup_rules:
      - 'c *:* rwm'
    cap_add:
      - NET_ADMIN
    stop_grace_period: 2m
    secrets:
      - windows_username
      - windows_password
      - secrets2env
    networks:
      - internal_net
    restart: unless-stopped

  kali:
    image: kalilinux/kali-rolling
    container_name: kali
    command: sleep infinity
    tty: true
    stdin_open: true
    networks:
      - public_net
    restart: unless-stopped

networks:
  public_net:
    driver: bridge
  internal_net:
    driver: bridge
    internal: true
